# Netlify Configuration File
# This tells Netlify where to find your functions

[build]
  # This is where your website files are (usually root)
  publish = "."
  
  # This tells Netlify where your serverless functions are
  functions = "netlify/functions"

# Redirect rules (optional but helpful)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security (optional)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"